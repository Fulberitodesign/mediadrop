name: Build & Release

# Se declenche automatiquement quand on pousse un tag de version (ex: v1.0.0),
# ou manuellement depuis l'onglet "Actions" de GitHub ("Run workflow").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        run: npm install

      - name: Construire l'installeur (${{ matrix.os }})
        run: npm run ${{ matrix.script }}

      - name: Sauvegarder l'installeur construit
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer tous les installeurs construits
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publier une nouvelle Release GitHub avec les installeurs
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
