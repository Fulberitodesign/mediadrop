<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: applib:; media-src 'self' applib:; connect-src 'self' applib:; style-src 'self' 'unsafe-inline';" />
<title>MediaDrop</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <button id="addFolderBtn" title="Ajouter un dossier a la librairie">+ Ajouter un dossier</button>
      <div id="searchWrap">
        <input id="searchInput" type="text" placeholder="Rechercher dans ce dossier..." />
      </div>
      <div id="viewToggle">
        <button id="gridViewBtn" class="active" title="Vue grille">▦</button>
        <button id="listViewBtn" title="Vue liste">☰</button>
      </div>
    </header>

    <div id="body">
      <aside id="sidebar">
        <div id="sidebarHeader">MA LIBRAIRIE</div>
        <div id="folderTree"></div>
        <div id="emptyLibraryHint" class="hint">
          Aucun dossier pour l'instant.<br />
          Clique sur "+ Ajouter un dossier" pour commencer.
        </div>
      </aside>

      <main id="mainPane">
        <div id="breadcrumb"></div>
        <div id="fileGrid" class="grid-view"></div>
        <div id="emptyFolderHint" class="hint" style="display:none;">Ce dossier est vide.</div>
      </main>
    </div>

    <!-- Barre de lecture audio (comme le moniteur source de Premiere) -->
    <div id="playerBar" class="player-bar" style="display:none;">
      <button id="playerPlayBtn" class="player-btn" title="Lecture / Pause (Espace)">▶</button>
      <div class="player-time" id="playerCurrentTime">00:00</div>
      <div class="player-waveform" id="playerWaveform" title="Cliquer pour se deplacer dans le son">
        <img id="playerWaveformImg" alt="" draggable="false" />
        <div class="player-playhead" id="playerPlayhead"></div>
      </div>
      <div class="player-time" id="playerDuration">00:00</div>
      <div class="player-volume">
        <span id="playerMuteBtn" class="player-vol-icon" title="Activer/couper le son">🔊</span>
        <input id="playerVolumeSlider" type="range" min="0" max="1" step="0.01" value="1" title="Volume" />
      </div>
      <div class="player-filename" id="playerFileName" title=""></div>
    </div>
  </div>

  <div id="contextMenu" class="context-menu" style="display:none;"></div>

  <!-- Lecteur audio partage pour l'ecoute rapide au clic -->
  <audio id="previewAudio" preload="none"></audio>

  <!-- Lightbox pour la lecture video en grand -->
  <div id="videoModal" class="modal" style="display:none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="closeModalBtn" class="modal-close" title="Fermer">✕</button>
      <video id="modalVideo" controls autoplay></video>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
